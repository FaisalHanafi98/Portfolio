# Subdomain Nginx Template
# Copy and modify for each project subdomain:
#   ringgitsense.faisalhanafi.com -> /var/www/ringgitsense
#   sen2nal.faisalhanafi.com      -> /var/www/sen2nal
#
# Deploy to: /etc/nginx/conf.d/{project}.conf
# DNS: Add A record for {project}.faisalhanafi.com -> 54.169.32.54
# HTTPS: sudo certbot --nginx -d {project}.faisalhanafi.com

server {
    listen 80;
    server_name SUBDOMAIN.faisalhanafi.com;

    root /var/www/SUBDOMAIN;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (if the subdomain project has its own backend)
    # location /api/ {
    #     proxy_pass http://127.0.0.1:PORT;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
