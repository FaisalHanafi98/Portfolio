# Portfolio Nginx Configuration — faisalhanafi.com
# Deploy to: /etc/nginx/conf.d/portfolio.conf
# After deploy: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d faisalhanafi.com -d www.faisalhanafi.com

# Redirect www to non-www
server {
    listen 80;
    server_name www.faisalhanafi.com;
    return 301 $scheme://faisalhanafi.com$request_uri;
}

server {
    listen 80;
    server_name faisalhanafi.com;

    root /var/www/portfolio;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Static assets — aggressive caching (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon, robots, sitemap, og-image
    location ~* ^/(favicon\.svg|robots\.txt|sitemap\.xml|og-image\.png)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Other static files (images, fonts)
    location ~* \.(ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API proxy to Spring Boot backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # Actuator/health — restricted to localhost only
    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        allow 127.0.0.1;
        deny all;
    }

    # Block Swagger UI in production
    location ~* ^/(swagger-ui|api-docs|v3/api-docs) {
        deny all;
        return 404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable server version in headers
    server_tokens off;
}
