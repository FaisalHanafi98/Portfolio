spring:
  profiles:
    default: dev
  application:
    name: portfolio-api

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
    java:
      enabled: true

portfolio:
  status:
    db-timeout-ms: ${STATUS_DB_TIMEOUT_MS:1000}
    window-seconds: ${STATUS_WINDOW_SECONDS:300}
    min-samples: ${STATUS_MIN_SAMPLES:20}
    revision: ${APP_REVISION:}
    github:
      enabled: ${STATUS_GITHUB_ENABLED:true}
      scheduling-enabled: ${STATUS_GITHUB_SCHEDULING_ENABLED:true}
      owner: ${STATUS_GITHUB_OWNER:FaisalHanafi98}
      repo: ${STATUS_GITHUB_REPO:Portfolio}
      api-base-url: ${STATUS_GITHUB_API_BASE_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
      cache-ttl-seconds: ${STATUS_GITHUB_CACHE_TTL_SECONDS:900}
      initial-backoff-seconds: ${STATUS_GITHUB_INITIAL_BACKOFF_SECONDS:60}
      max-backoff-seconds: ${STATUS_GITHUB_MAX_BACKOFF_SECONDS:3600}
      request-timeout-ms: ${STATUS_GITHUB_TIMEOUT_MS:4000}
      max-items: ${STATUS_GITHUB_MAX_ITEMS:5}
      poll-tick-ms: ${STATUS_GITHUB_POLL_TICK_MS:30000}
      poll-initial-delay-ms: ${STATUS_GITHUB_POLL_INITIAL_DELAY_MS:10000}
