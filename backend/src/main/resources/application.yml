spring:
  profiles:
    default: dev
  application:
    name: portfolio-api

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    build:
      enabled: true
    java:
      enabled: true

portfolio:
  status:
    db-timeout-ms: ${STATUS_DB_TIMEOUT_MS:1000}
    window-seconds: ${STATUS_WINDOW_SECONDS:300}
    min-samples: ${STATUS_MIN_SAMPLES:20}
    revision: ${APP_REVISION:}
