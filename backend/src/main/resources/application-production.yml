spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://faisalhanafi.com,https://www.faisalhanafi.com}

logging:
  level:
    com.faisal.portfolio: INFO
    org.hibernate.SQL: WARN

server:
  port: ${PORT:8080}
