spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    baseline-description: Explicit baseline for pre-Flyway portfolio schema
    url: ${FLYWAY_URL:${DB_URL}}
    user: ${FLYWAY_USER:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://faisalhanafi.com,https://www.faisalhanafi.com}

# Disable Swagger/OpenAPI in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Restrict Actuator in production so metrics and Prometheus remain private
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    prometheus:
      access: none

logging:
  level:
    com.faisal.portfolio: INFO
    org.hibernate.SQL: WARN

server:
  port: ${PORT:8080}
  # Prevent information leakage
  error:
    include-stacktrace: never
    include-message: never
