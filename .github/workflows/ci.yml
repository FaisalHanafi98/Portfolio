name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew clean build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test/
          retention-days: 7

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test content states
        run: npm test

      - name: Build
        run: npm run build
        # VITE_API_URL intentionally unset — defaults to /api/v1 (relative)
        # Nginx proxies /api/ to Spring Boot on port 8080

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Start local stack
        run: docker compose up --build -d

      - name: Verify project routes through Nginx
        run: |
          base=http://localhost:3000
          for attempt in {1..40}; do
            if curl -fsS --max-time 2 "$base/api/v1/projects" 2>/dev/null |
              jq -e '.success and any(.data[]; .slug == "creams")' >/dev/null; then
              break
            fi
            sleep 3
          done

          curl -fsS --max-time 10 "$base/api/v1/projects" |
            jq -e '.success and any(.data[]; .slug == "creams")'
          curl -fsS --max-time 10 "$base/api/v1/health" |
            jq -e '.success and .data.status == "ok"'
          curl -fsS --max-time 10 "$base/api/v1/status" |
            jq -e '.success and .data.database != null and .data.github != null'
          curl -fsS --max-time 10 "$base/api/v1/analytics/summary" |
            jq -e '.success and (.data.projectFunnel | type == "array")'
          curl -fsS --max-time 10 "$base/api/v1/projects/creams" |
            jq -e '.success and .data.slug == "creams"'
          curl -fsS --max-time 10 "$base/projects/creams" |
            grep -F '<div id="root"></div>'
          curl -fsS --max-time 10 "$base/status" |
            grep -F '<div id="root"></div>'
          curl -fsS --max-time 10 "$base/analytics" |
            grep -F '<div id="root"></div>'

      - name: Test browser journeys against PostgreSQL and Nginx
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
