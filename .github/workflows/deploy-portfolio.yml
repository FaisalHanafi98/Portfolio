name: Deploy Portfolio to Lightsail

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_URL intentionally unset — defaults to /api/v1 (relative)
      # Nginx on Lightsail proxies /api/ to Spring Boot on port 8080
      - name: Build React Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build Spring Boot JAR
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Create deployment package
        run: |
          set -euo pipefail
          mkdir -p deploy-pkg
          cp -r frontend/dist deploy-pkg/frontend
          mapfile -t DEPLOY_JARS < <(find backend/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | sort)
          if [ "${#DEPLOY_JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one deployable Spring Boot JAR, found ${#DEPLOY_JARS[@]}"
            printf '%s\n' "${DEPLOY_JARS[@]}"
            exit 1
          fi
          cp "${DEPLOY_JARS[0]}" deploy-pkg/portfolio-backend.jar
          cp deploy/nginx-portfolio.conf deploy-pkg/
          cp deploy/nginx-portfolio-bootstrap.conf deploy-pkg/
          cp deploy/portfolio.service deploy-pkg/

      - name: Deploy to Lightsail
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_IP: ${{ secrets.LIGHTSAIL_IP }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H $LIGHTSAIL_IP >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/lightsail.pem ec2-user@$LIGHTSAIL_IP"
          SCP="scp -i ~/.ssh/lightsail.pem"

          # Deploy frontend
          echo "--- Deploying frontend ---"
          $SSH "mkdir -p /tmp/portfolio-frontend"
          $SCP -r deploy-pkg/frontend/* ec2-user@$LIGHTSAIL_IP:/tmp/portfolio-frontend/
          $SSH "sudo rm -rf /var/www/portfolio/* && sudo cp -r /tmp/portfolio-frontend/* /var/www/portfolio/ && sudo chown -R nginx:nginx /var/www/portfolio && rm -rf /tmp/portfolio-frontend"

          # Deploy backend JAR
          echo "--- Deploying backend ---"
          $SCP deploy-pkg/portfolio-backend.jar ec2-user@$LIGHTSAIL_IP:/home/ec2-user/portfolio-backend.jar

          # Deploy Nginx config (only if changed)
          echo "--- Syncing Nginx config ---"
          $SCP deploy-pkg/nginx-portfolio.conf ec2-user@$LIGHTSAIL_IP:/tmp/portfolio.conf
          $SCP deploy-pkg/nginx-portfolio-bootstrap.conf ec2-user@$LIGHTSAIL_IP:/tmp/portfolio-bootstrap.conf
          $SSH "set -euo pipefail; if [ -f /etc/letsencrypt/live/faisalhanafi.com/fullchain.pem ] && [ -f /etc/letsencrypt/live/faisalhanafi.com/privkey.pem ]; then sudo cp /tmp/portfolio.conf /etc/nginx/conf.d/portfolio.conf; echo 'Applied HTTPS Nginx config.'; else sudo cp /tmp/portfolio-bootstrap.conf /etc/nginx/conf.d/portfolio.conf; echo 'Applied bootstrap HTTP Nginx config because certificate files are missing.'; fi; sudo nginx -t && sudo systemctl reload nginx"

          # Deploy systemd service (only if changed)
          echo "--- Syncing systemd service ---"
          $SCP deploy-pkg/portfolio.service ec2-user@$LIGHTSAIL_IP:/tmp/portfolio.service
          $SSH "sudo cp /tmp/portfolio.service /etc/systemd/system/portfolio.service && sudo systemctl daemon-reload"

          # Restart backend
          echo "--- Restarting backend ---"
          $SSH "sudo systemctl restart portfolio"

          # Cleanup
          $SSH "rm -f /tmp/portfolio.conf /tmp/portfolio-bootstrap.conf /tmp/portfolio.service"

      - name: Verify deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_IP: ${{ secrets.LIGHTSAIL_IP }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "$LIGHTSAIL_IP" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/lightsail.pem ec2-user@$LIGHTSAIL_IP"

          echo "Verifying portfolio service restart..."
          if ! $SSH "for attempt in 1 2 3 4 5 6; do if sudo systemctl is-active --quiet portfolio; then exit 0; fi; sleep 5; done; exit 1"; then
            echo "portfolio service failed to reach active state"
            $SSH "sudo systemctl status portfolio --no-pager || true; sudo journalctl -u portfolio -n 50 --no-pager || true"
            exit 1
          fi

          echo "Verifying Nginx serves the frontend for faisalhanafi.com over HTTP on the host..."
          if ! $SSH "curl -fsS -H 'Host: faisalhanafi.com' http://127.0.0.1/ --max-time 10 > /dev/null"; then
            echo "frontend verification failed through Nginx"
            exit 1
          fi

          echo "Verifying /api/v1/health through Nginx with the production host over HTTP on the host..."
          if ! $SSH "curl -fsS -H 'Host: faisalhanafi.com' http://127.0.0.1/api/v1/health --max-time 10"; then
            echo "API verification failed through Nginx"
            $SSH "sudo journalctl -u portfolio -n 50 --no-pager || true"
            exit 1
          fi

          echo "Verifying whether the production certificate exists..."
          if ! $SSH "test -f /etc/letsencrypt/live/faisalhanafi.com/fullchain.pem && test -f /etc/letsencrypt/live/faisalhanafi.com/privkey.pem"; then
            echo "HTTPS verification failed: certificate files are missing on the server."
            echo "Run: sudo certbot --nginx -d faisalhanafi.com -d www.faisalhanafi.com"
            exit 1
          fi

          echo "Verifying the public site responds over HTTPS..."
          if ! curl -fsS https://faisalhanafi.com/ --max-time 20 > /dev/null; then
            echo "Public HTTPS frontend verification failed"
            exit 1
          fi

          echo "Verifying the public API responds over HTTPS..."
          if ! curl -fsS https://faisalhanafi.com/api/v1/health --max-time 20; then
            echo "Public HTTPS API verification failed"
            exit 1
          fi

          echo "Deployment verification passed."
